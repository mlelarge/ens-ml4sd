title: "Machine Learning for Scientific Discovery"
description: "ENS course materials"

# Theme
theme: minima

# Navigation
header_pages:
  - 1_intro.md
  - 2_hypothesis.md
  - 4_optimization.md
  
# Math support with kramdown
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# Enable MathJax
plugins:
  - jekyll-feed

# Minima theme settings for MathJax
minima:
  social_links:
    - { platform: github, user_url: "https://github.com/mlelarge/ens-ml4sd" }